name: AetherEngine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: 'หมายเหตุรอบทดสอบ (optional)'
        required: false
        default: 'manual trigger'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build configs
        run: |
          echo "=== Build config verification ==="
          test -f build.gradle.kts                || { echo "MISSING: root build.gradle.kts"; exit 1; }
          test -f settings.gradle.kts             || { echo "MISSING: root settings.gradle.kts"; exit 1; }
          test -f app/android/build.gradle        || { echo "MISSING: app/android/build.gradle"; exit 1; }
          test -f app/android/settings.gradle     || { echo "MISSING: app/android/settings.gradle"; exit 1; }
          test -f app/android/app/build.gradle    || { echo "MISSING: app/android/app/build.gradle"; exit 1; }
          test -f aether-core/build.gradle.kts    || { echo "MISSING: aether-core/build.gradle.kts"; exit 1; }
          test -f aether-android/aether-app/build.gradle.kts || { echo "MISSING: aether-android/aether-app/build.gradle.kts"; exit 1; }
          # Unified engine: aether-layer ต้องถูก merge แล้ว (ไม่ควรมี directory นี้)
          test ! -d aether-layer || { echo "STALE: aether-layer/ ต้องถูกลบ (merged into aether-native)"; exit 1; }
          # Unified native: layer sources ต้องอยู่ใน aether-native
          test -f aether-native/src/main/cpp/layer/bindmount/virtual_fs.cpp || { echo "MISSING: l1-sandbox merged source"; exit 1; }
          test -f aether-native/src/main/cpp/core/aob_scanner.cpp || { echo "MISSING: aob_scanner source"; exit 1; }
          echo "All build configs verified (unified structure)."

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          cache: true
      - name: Flutter pub get + analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app

  compile:
    # ข้ามบน main: build-apk.yml ครอบคลุม gradle native compile + flutter build แล้ว
    # (ป้องกัน native compile + debug APK build ซ้ำฟรี ~5-6 นาที ทุก push ไป main)
    # develop / PR ยังคงรันเต็มเพื่อกัน merge พังก่อนเข้า main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          cache: true

      - name: Compile Kotlin modules + Native engine (root Gradle)
        run: |
          ./gradlew --no-daemon --console=plain \
            :aether-core:compileDebugKotlin \
            :aether-android:compileDebugKotlin \
            :aether-native:externalNativeBuildDebug

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build debug APK
        run: |
          flutter build apk --debug --no-tree-shake-icons
        working-directory: app

      - name: Verify APK output
        run: |
          echo "=== APK output ==="
          find app/build/app/outputs -name "*.apk" -type f
          APK_FILE=$(find app/build/app/outputs -name "app-debug*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/app/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          ls -lh "$APK_FILE"
          echo "APK built successfully ($(du -h "$APK_FILE" | cut -f1))."
