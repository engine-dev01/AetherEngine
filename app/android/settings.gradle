pluginManagement {
    def flutterSdkPath = {
        def localPropertiesFile = new File(rootDir, "local.properties")
        def properties = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT environment variable is not set"
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}
include ":app"
include ":aether-native"
project(":aether-native").projectDir = file("../../aether-native")
include ":aether-core"
project(":aether-core").projectDir = file("../../aether-core")
include ":aether-android"
project(":aether-android").projectDir = file("../../aether-android/aether-app")
